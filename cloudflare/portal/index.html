<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mooral Employee Portal</title><link rel="stylesheet" href="/portal.css"></head><body><main id="app"><section id="login" class="card"><h1>Mooral Employee Portal</h1><p>Secure company workspace access</p><input id="workspace" placeholder="Company ID" autocomplete="organization"><input id="username" placeholder="Username" autocomplete="username"><input id="password" type="password" placeholder="Password" autocomplete="current-password"><label class="remember"><input id="remember" type="checkbox"> Remember me</label><button id="loginBtn">Login</button><small id="error"></small></section><section id="home" class="hidden"><header><div><strong>Mooral Business Suite</strong><span id="identity"></span></div><button id="logout">Logout</button></header><div class="grid"><button data-module="dashboard">Dashboard</button><button data-module="products">Products</button><button data-module="customers">Customers</button><button data-module="orders">Orders</button><button data-module="invoices">Invoices</button><button data-module="inventory">Inventory</button><button data-module="messages">Messages</button><button data-module="reports">Reports</button></div><section id="passwordCard" class="card hidden"><h2>Change password</h2><input id="currentPassword" type="password" placeholder="Current password"><input id="newPassword" type="password" placeholder="New password (10+ characters)"><button id="changePasswordBtn">Update password</button><small id="passwordError"></small></section><section id="content" class="card"><h2>Welcome</h2><p>Select a module you are permitted to use.</p></section></section></main><script src="/portal.js"></script></body></html>
